services:
  - type: web
    name: mehdi-social-automation
    runtime: docker
    repo: https://github.com/mehtiyoox/kaarYaabi-automas
    rootDir: social-automation/deploy/render
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: N8N_HOST
        sync: false
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: YOUR_TELEGRAM_ID
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - fromGroup: production-db
databases:
  - name: social-postgres
    plan: free
    databaseName: socialautomation
    user: socialuser
    ipAllowList: [{"cidr": "0.0.0.0/0", "description": "allow all"}]
    postgresMajorVersion: 16
envVarGroups:
  - name: production-db
    envVars:
      - key: PGHOST
        fromDatabase:
          name: social-postgres
          property: host
      - key: PGPORT
        fromDatabase:
          name: social-postgres
          property: port
      - key: PGDATABASE
        fromDatabase:
          name: social-postgres
          property: database
      - key: PGUSER
        fromDatabase:
          name: social-postgres
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: social-postgres
          property: password
